<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Red Wing Pick of the Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800;9..144,900&family=Lato:wght@400;700;900&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-pattern" aria-hidden="true"></div>

  <header class="top-bar">
    <div class="title-block">
      <h1 id="pageTitle">Red Wing Pick of the Day</h1>
    </div>
    <div class="weather-block" id="weatherBlock">
      <div class="temp" id="tempDisplay">--°</div>
      <div class="city" id="cityDisplay">Locating…</div>
    </div>
  </header>

  <main id="mainContent">
    <p class="intro" id="introParagraph">Getting your location and today's forecast…</p>

    <div class="choices" id="choicesGrid"></div>

    <section class="custom-outfit">
      <label for="outfitInput">Do you have a different outfit in mind?</label>
      <div class="custom-outfit-row">
        <textarea
          id="outfitInput"
          rows="2"
          placeholder="e.g. dark jeans, plaid flannel shirt, olive jacket"
        ></textarea>
        <button id="outfitSubmit" type="button">Find my boot</button>
      </div>
    </section>

    <div class="choices" id="customPickResult" hidden></div>
  </main>

  <p class="error" id="errorMessage" hidden></p>

  <script type="module" src="app.js"></script>
</body>
</html>
